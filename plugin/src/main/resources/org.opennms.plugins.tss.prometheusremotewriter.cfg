# OpenNMS Prometheus Remote Writer — plugin configuration
#
# PID: org.opennms.plugins.tss.prometheusremotewriter
#
# NOTE: the PID / filename is deliberately dashless. Felix fileinstall
# treats "<prefix>-<instance>.cfg" as a factory-PID pattern and would
# split a dashed filename into factoryPid + instance, which the
# singleton property-placeholder in blueprint.xml then fails to match.
#
# Changes take effect on the next flush cycle; no OpenNMS restart required.
# Lines starting with '#' are comments. Blank values use the plugin default
# shown in the comment above each setting. Note there are no mid-line
# comments: everything after '=' is part of the value.
#
# --- Secrets ------------------------------------------------------------------
#
# You do not have to write secrets into this file. Karaf resolves both of the
# following in any value below, with no container changes:
#
#   ${env:NAME}       substituted when this file is read; covers every key
#   $[secret:name]    reads etc/name and uses its content as the value
#
# For example:
#
#   auth.bearer.token              = ${env:PROM_TOKEN}
#   auth.bearer.token              = $[secret:prom-token]
#   auth.authorization.credentials = ${env:PROM_TOKEN}
#   auth.authorization.credentials = $[secret:prom-token]
#
# An unset ${env:NAME} resolves to an EMPTY value. For http.headers.* and the
# URLs that is rejected by name at startup. For auth.bearer.token and
# tenant.org-id an empty value is indistinguishable from "disabled", so the
# plugin starts and sends no credential — check the startup log line
# "prometheus-remote-writer authentication: ..." after changing one. For
# auth.authorization.*, an empty half is caught by name as long as the OTHER
# half is set, which the recommended shape below (literal type, ${env:NAME}
# credentials) guarantees.
#
# Editing this PID from the Karaf shell (config:edit / property-set) writes
# the RESOLVED value back to this file, replacing a placeholder with the
# secret in cleartext. Edit the file directly when using either form.
#
# Full detail is in the configuration reference under "Keeping secrets out of
# the configuration file".

# --- Endpoint -----------------------------------------------------------------

# HTTPS URL of your Prometheus-compatible Remote Write endpoint. Required.
#   Prometheus:         https://prom.example.com/api/v1/write
#   Grafana Mimir:      https://mimir.example.com/api/v1/push
#   VictoriaMetrics:    https://vm.example.com/api/v1/write
#   Cortex:             https://cortex.example.com/api/v1/push
#   Thanos Receive:     https://thanos.example.com/api/v1/receive
write.url =

# HTTPS URL of the backend's Prometheus-compatible query root. The plugin
# appends /api/v1/series, /api/v1/query, /api/v1/query_range and
# /api/v1/label/resourceId/values itself. Do NOT include
# /api/v1 in this value. OpenNMS internals call this path for Resource
# Graphs, threshold evaluation, and the measurement API. Required.
#   Prometheus:         https://prom.example.com
#   Grafana Mimir:      https://mimir.example.com/prometheus
#   VictoriaMetrics:    https://vm.example.com
#   Cortex:             https://cortex.example.com/prometheus
#   Thanos Query:       https://thanos-query.example.com
read.url =

# --- Source identity ----------------------------------------------------------
# Stable per-OpenNMS-instance identifier. When set, every sample gains an
# onms_instance_id label with this value so multiple OpenNMS instances
# writing to the same backend can be distinguished in PromQL. Leave blank
# for single-instance deployments; the plugin logs a one-shot WARN on
# startup noting the knob. See "Identifying samples from multiple OpenNMS
# instances" in the Labels and enrichment section of the docs for the
# decision table.
instance.id =

# Override for the `job` default label. When set, every sample emits
# job=<this value> regardless of the resourceId-derived default (snmp /
# jmx / opennms). Leave blank to use per-sample derivation. See "Default
# label set" in the Labels and enrichment section of the docs for the
# derivation table.
job.name =

# --- Authentication -----------------------------------------------------------
# The three blocks below — Basic, Bearer, and the custom-scheme block — each
# produce the Authorization header, so they are mutually exclusive. Configure
# exactly one of them, or none. If more than one is set the plugin refuses to
# start.

# HTTP Basic auth. Leave both blank to disable.
auth.basic.username =
auth.basic.password =

# Bearer token. Leave blank to disable. Shorthand for
# auth.authorization.type = Bearer.
auth.bearer.token =

# Custom Authorization scheme, for backends and gateways that authenticate
# with a keyword other than Basic or Bearer. The plugin sends
#
#   Authorization: <auth.authorization.type> <auth.authorization.credentials>
#
# on the write path AND the read path. Leave BOTH blank to disable; setting
# the type alone is rejected at startup, since it cannot produce a header.
#
#   auth.authorization.type = Token
#   auth.authorization.type = ApiKey
#
# The keyword is used verbatim — surrounding whitespace is trimmed, casing is
# preserved, no allowlist of known schemes is applied. It must be a single
# word: "Token abc123" here is rejected, because the credentials belong in the
# key below. Only "Basic" is refused outright: build Basic credentials with
# auth.basic.username / auth.basic.password instead.
#
# There is NO default scheme. Both keys are required together: setting the
# credentials without the type fails at startup by name. That is deliberate —
# if an empty type silently meant "Bearer", then a typo'd
# auth.authorization.type = ${env:NAME} would send "Bearer <your-token>" to a
# backend expecting "Token <your-token>": 401 on every request, forever, with
# a clean startup log. For a plain bearer token use auth.bearer.token, which
# produces exactly the same header as type = Bearer.
#
# Both values must be printable ASCII with no CR or LF. A trailing newline —
# the usual $[secret:name] case — is stripped before the check, so only an
# interior one is rejected. Startup errors name the key, never the value.
#
# Note the asymmetry in the hot-reload diff log: the credentials value is
# masked as "(set)", the type is shown in the clear. Keep the secret in
# auth.authorization.credentials, never in the type.
auth.authorization.type =
auth.authorization.credentials =

# Multi-tenant X-Scope-OrgID header (Cortex, Mimir). Leave blank to disable.
tenant.org-id =

# --- Custom HTTP headers ------------------------------------------------------

# Arbitrary headers attached to every outbound request — the write path AND the
# read path, since Zero-Trust gateways gate both with the same credentials.
# One property per header: the suffix after "http.headers." is the header name,
# the value is attached as-is (surrounding whitespace trimmed). No entries are
# configured by default.
#
# Mind the plural: "http.header.foo" is silently ignored. On startup the plugin
# logs one INFO line naming every header it detected (values redacted), so
# check the Karaf log to confirm your keys were picked up.
#
# http.headers.cf-access-client-id     = 9a4f8c3a2e...
# http.headers.cf-access-client-secret = 7c8eb18f...
# http.headers.User-Agent              = onms-edge-site-7/1.0
#
# Reserved (the plugin logs an ERROR and serves nothing until removed):
# Content-Type, Content-Encoding, Content-Length, Transfer-Encoding, Host,
# Connection, Upgrade, Accept-Encoding, TE, Expect, Www-Authenticate,
# X-Prometheus-Remote-Write-Version — protocol or transport invariants;
# Authorization and Proxy-Authorization — use auth.basic.*, auth.bearer.token,
# or auth.authorization.* for a custom scheme keyword;
# X-Scope-OrgID — use tenant.org-id. User-Agent is allowed and overrides the
# plugin default.
#
# Header values are cleartext here. See "Keeping secrets out of the
# configuration file" in the configuration reference for the ${env:NAME} and
# $[secret:name] forms, described once at the top of this file.

# --- TLS ----------------------------------------------------------------------

# PEM bundle of CA certificates to trust. When set it REPLACES the JDK
# default truststore as the only trust anchor. Leave blank to use the JDK
# defaults.
tls.ca-file =

# Disable hostname and certificate verification. DO NOT enable in production;
# the plugin logs a WARN at startup and then every hour while it is on.
tls.insecure-skip-verify = false

# --- Write pipeline -----------------------------------------------------------

# Total in-memory buffer, split evenly across writer.shards — 10,000 a
# shard at the default four. A shard that fills spills to its disk bucket
# rather than refusing; see the overflow section below.
queue.capacity = 40000

# What store() does when a shard's queue is full (queue mode only).
#   partial         attempt every sample, count the refused ones, throw once.
#                   A full shard never blocks samples bound for other shards.
#                   Right for a caller that drops the call on exception
#                   (Horizon's default ring-buffer writer).
#   all-or-nothing  enqueue nothing and throw if any shard lacks room for its
#                   share of the call. Right for a caller that retries the whole
#                   call until it is accepted (Horizon's offheap writer, which
#                   would otherwise re-send accepted samples on every retry).
#                   Each shard must have room for the samples of one store()
#                   call that hash to it.
#   auto            read org.opennms.timeseries.config.buffer_type from the JVM:
#                   OFFHEAP selects all-or-nothing, anything else selects
#                   partial. Sentinel keeps that setting in ConfigAdmin, so on
#                   Sentinel auto means partial; set the value explicitly there.
queue.store-policy = auto

# Maximum samples per outbound Remote Write request.
batch.size = 1000

# How long a flusher waits for a FIRST sample when its queue is empty before
# looping. It does not delay a send once samples are present: with
# batch.linger-ms = 0 a flusher sends as soon as the first sample arrives,
# carrying whatever else is queued at that moment. With a disk tier
# configured and overflow.fsync = batch it is also the fsync cadence.
flush.interval-ms = 1000

# After a first sample has arrived, how long a flusher waits for the batch to
# reach batch.size before sending, draining at every arrival and sending early
# the moment the batch is full. Default 100; 0 sends on first arrival. Raise it
# when the queue is usually empty and requests are small: at 4 shards on an
# 11,000-device fleet, 0 gave 3,300 requests/s of 19 samples; 50-200 ms gives
# full batches at the cost of at most that much added latency. Applies to
# the memory tier; a shard draining its disk bucket sends what the reader
# returns and does not linger.
batch.linger-ms = 100

# 5xx retry policy. 4xx responses are dropped immediately.
retry.max-attempts        = 5
retry.initial-backoff-ms  = 250
retry.max-backoff-ms      = 10000

# --- HTTP client --------------------------------------------------------------

http.connect-timeout-ms = 5000
http.read-timeout-ms    = 30000
http.write-timeout-ms   = 30000
http.max-connections    = 16

# --- Shutdown -----------------------------------------------------------------

# Grace period for draining the queue on bundle stop. Samples still queued
# after this window are logged at WARN and dropped.
shutdown.grace-period-ms = 10000

# --- Write parallelism ----------------------------------------------------------

# Number of write shards. Default 4; 1 is the classic single-flusher
# pipeline. N>1 splits the pipeline into N shards, each owning a disjoint
# set of series (hash of the label set), a queue segment of
# queue.capacity/N, and its own flusher with at most one request in
# flight — per-series sample order is preserved while shards flush in
# parallel. Each shard also owns its own overflow bucket, so sharding and
# durability combine. Capped at http.max-connections; queue.capacity/N
# must be >= batch.size. The
# backend sees up to N concurrent streams — mind per-tenant ingest
# limits on Mimir / VictoriaMetrics cluster.
writer.shards = 4

# --- Disk overflow tier ---------------------------------------------------------

# The disk tier behind each shard's memory queue. When a shard's queue
# fills, its whole backlog moves to that shard's bucket and every further
# sample for the shard goes to disk until the bucket drains — so a full
# queue spills instead of refusing, and per-series order is preserved
# across the boundary. A shard drains its bucket before its queue, and a
# bucket releases a segment only once the backend has accepted it, so
# nothing is lost to a backend outage while the bucket has room.
#
# Directory holding one subdirectory per shard. Blank resolves to
# ${karaf.data}/prometheus-remote-writer/overflow. Under containerised
# Karaf with an ephemeral ${karaf.data} this MUST point at a mounted
# volume or the tier evaporates on restart, which defeats its purpose.
overflow.dir = 

# Total on-disk budget across every shard's bucket, split evenly at
# startup. Divided by (samples/s x bytes per sample), this is how long a
# backend outage can last before the plugin starts refusing. Bytes per
# sample depends on the label set, since every sample's labels are stored
# uncompressed. Measure it from the overflow_bytes and
# overflow_pending_samples gauges during an outage, subtracting the
# overflow_bytes reading from when nothing was pending (see the Sizing
# section of the docs). An OpenNMS SNMP fleet under the 0.8 label set measured
# about 340 bytes, so 4 GiB at 64,000 samples/s is about 3 to 4 minutes.
#
# 0 disables the disk tier entirely — no directory is created and a full
# queue refuses with a StorageException, which is the pre-0.8.0 behaviour.
overflow.max-size-bytes = 4294967296

# What a shard does when its bucket is also full:
#
#   refuse       (default) — refuse the append, count it in
#                samples_dropped_overflow_full_total and throw, pushing the
#                decision back to OpenNMS. Losing data is a deliberate
#                choice, not a default.
#   drop-oldest  — evict the oldest whole segment, count its samples in
#                samples_evicted_overflow_total, and accept the new sample.
#                Keeps the newest data at the cost of the oldest.
overflow.full = refuse

# Durability of bucket writes:
#
#   always  fsync every append. Tightest RPO, lowest throughput.
#   batch   (default) fsync on the flush.interval-ms boundary. Loses at
#           most that much data to a kernel-level crash.
#   none    OS page cache only. Suitable for ephemeral deployments.
overflow.fsync = batch

# How a shard divides its drain between the two tiers:
#
#   ordered      (default) the bucket is drained to empty before any sample
#                from memory, and while it holds anything the shard's memory
#                queue stays empty — so per-series order survives the tier
#                boundary. Correct on every backend.
#   concurrent   memory keeps being used while the bucket drains and the two
#                alternate, so fresh samples do not queue behind the backlog.
#                Gives up per-series order across the boundary: only for
#                backends that accept out-of-order writes (VictoriaMetrics,
#                or Mimir inside its configured out-of-order window). Clears
#                the backlog in about twice the time.
overflow.drain = ordered

# --- Resource metadata --------------------------------------------------------
#
# A resource's string attributes and surveillance categories travel as series
# of their own rather than as labels on the data series:
#
#   onms_resource_attr{resourceId="…", key="ifAlias", value="uplink"} 1
#   onms_resource_category{resourceId="…", category="Production"} 1
#
# Three label names whatever OpenNMS supplies, so an attribute key nobody
# curated cannot grow the backend's label-name index, and an operator editing
# an interface description never splits a data series. What every data
# series already carries as a label (nodeLabel, foreignSource, foreignId,
# location, unless labels.exclude removes the label) and the cat_<Name>
# tags next to categories are not rows.
# Join in PromQL with
#   … * on(resourceId) group_left(value) last_over_time(onms_resource_attr{key="ifAlias"}[30m])
#
# How often the series of an unchanged resource are re-emitted, in
# milliseconds. New or changed metadata is emitted at once. Query with a
# lookback of twice this, e.g. last_over_time(onms_resource_attr[30m]).
# 0 switches the metadata series off; OpenNMS graph placeholders then no
# longer resolve, since the read path restores attributes from these rows.
metadata.cadence-ms = 900000

# Attributes per resource emitted as rows, lowest keys first. An SNMP
# interface carries about four to six; the budget only bites on JMX beans
# with dozens of properties. The remainder is counted in
# metadata_attrs_dropped_total.
metadata.attr-budget = 16

# Columns: a short configured subset of the attributes, emitted as one
# onms_resource_info series per resource for query ergonomics, so a panel
# can join on it with group_left(if_alias) instead of a row per attribute:
#
#   onms_resource_info{resourceId="…", if_alias="uplink", if_descr="Ethernet1"} 1
#
# Comma-separated column=key entries: the column is the label name on the
# wire, the key the OpenNMS attribute it is read from. The default covers
# the string attributes OpenNMS's shipped datacollection emits for its
# standard resource types, one column per key; a custom datacollection
# names its own column. A resource carries only the columns whose keys it
# has, and gets no info series when it has none. The collector attribute
# `name` becomes resource_name, because a label called name next to
# __name__ is a trap in every legend and query. The rows carry the first
# metadata.attr-budget attributes by key, so for a resource inside the
# budget a missing column costs one join and nothing else; for a key past
# the budget, a column is the way to put it on the wire. An attribute with
# an empty value, such as an unset ifAlias, makes no row and no column.
metadata.info-columns = if_alias=ifAlias, if_descr=ifDescr, resource_name=name, hr_storage_descr=hrStorageDescr, dsk_path=dskPath, datname=datname, spcname=spcname

# --- Read path ----------------------------------------------------------------

# findMetrics() lookback: how far back to search when the caller does not
# supply an explicit start. 7776000 = 90 days.
max-series-lookback-seconds = 7776000

# Resource-discovery strategy for findMetrics(). Two values:
#
#   single-pass         (default) — issue one GET /api/v1/series per call
#                       with the matcher-derived selector. Fast against
#                       vanilla Prometheus; bottleneck on Mimir / Thanos
#                       at scale because the broad regex on resourceId
#                       forces the backend to scan every matching series.
#
#   label-values-first  — opt-in two-phase path. Phase 1 enumerates
#                       resourceId values via /api/v1/label/resourceId/values
#                       (index-only on Mimir / Thanos, ~order-of-magnitude
#                       cheaper than the regex series scan). Phase 2 issues
#                       batched series queries with exact-match alternation
#                       per read.discovery-batch-size, preserving correctness
#                       while avoiding the broad-scan path. Activates only
#                       when the matcher collection actually carries a regex
#                       on resourceId — exact-match callers stay on the
#                       single-pass path even with the toggle on.
#
# Recommended: leave the default for vanilla Prometheus; flip to
# label-values-first for Mimir / Thanos / large multi-tenant backends.
# Observe the find_metrics_two_phase_total / find_metrics_single_pass_total
# counters to confirm the path mix in production.
read.discovery-strategy = single-pass

# Maximum number of resourceId values exact-match-alternated into one
# selector: the phase-2 selector under label-values-first, and the
# metadata enrichment query findMetrics issues under either strategy.
# Above this cap the enumeration is split into multiple calls. Bounds:
# 1..200. Default 50, picked to stay comfortably below typical HTTP
# request-line caps; upper bound 200 holds at ~30 KiB worst case, which
# fits cloud LB defaults but is the safe ceiling above default nginx /
# Mimir 8 KiB limits.
read.discovery-batch-size = 50

# --- Label policy -------------------------------------------------------------
# Default allowlist: __name__, resourceId, node, node_label, foreign_source,
# foreign_id, location, resource_type, resource_instance, if_name, job,
# instance, mtype, and onms_instance_id when instance.id is set. Resource
# string attributes, categories and the interface speed are not labels on
# the data series: see "Resource metadata" above.
#
# Override with comma-separated glob lists. The pipeline order is
# defaults, exclude, include, copy, rename, metadata: exclude runs first,
# right after the defaults.

# Add non-default source tags as labels. Example: sysDescr
labels.include =

# Remove default labels. Example: node_label  (useful if you see churn)
labels.exclude =

# Rename emitted labels. Format: fromKey->toKey, fromKey2->toKey2
labels.rename =

# Emit a label under an additional name (leaving the original intact).
# Format: fromKey->toKey, fromKey->toKey2. Multiple targets from the same
# source are allowed. See "Label policy" in the Configuration reference of
# the docs for common recipes.
labels.copy =

# Removed in 1.0.0: labels.if-speed-mode, labels.categories-mode,
# labels.profile, labels.attr-mode and labels.attr-include. A .cfg that
# still sets one fails validation; the attributes, categories and speed
# they shaped are the metadata series (onms_resource_attr,
# onms_resource_category, onms_resource_ifspeed, onms_resource_info).

# Prepend a prefix to every emitted metric name (useful for multi-tenant
# backends where you want OpenNMS metrics namespaced). Blank = no prefix.
# Applies to OpenNMS metric names only; the onms_resource_* metadata series
# keep their names, so the documented joins work under any prefix.
metric.prefix =

# --- OpenNMS metadata passthrough (OFF by default) ---------------------------
# WARNING: OpenNMS metadata commonly holds credentials (snmp-community,
# passwords, tokens). A built-in denylist blocks obvious credential patterns
# regardless of what you put in include, but you should still be explicit.

metadata.enabled = false

# Comma-separated glob list, format "context:key". Example:
#   metadata.include = requisition:*, node:owner
metadata.include =

# Additional denylist entries beyond the built-in patterns
# (*password*, *secret*, *token*, *key*, snmp-community).
metadata.exclude =

# Label name prefix for metadata values. Emitted as
# <prefix><context>_<sanitized-key>=<value>.
metadata.label-prefix = onms_meta_

# Case policy for metadata keys: "preserve" (keep OpenNMS casing, often
# camelCase) or "snake_case".
metadata.case = preserve
