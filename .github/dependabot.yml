version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      # init and analyze must run the same version; split PRs fail CI
      # with "Loaded a configuration file for version X, but running Y".
      codeql-action:
        patterns:
          - github/codeql-action*

  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    labels:
      - dependencies
      - docker

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    labels:
      - dependencies
      - maven
