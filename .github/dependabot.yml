version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Give upstreams a week to yank a bad or compromised release before
    # Dependabot proposes it (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      # init and analyze must run the same version; split PRs fail CI
      # with "Loaded a configuration file for version X, but running Y".
      codeql-action:
        patterns:
          - github/codeql-action*

  - package-ecosystem: docker-compose
    # Dependabot does not recurse, so every directory holding a compose file
    # is listed. `directories` (plural) is the key that takes a list.
    directories:
      - /e2e
      - /e2e/sentinel
    schedule:
      interval: weekly
    # Give upstreams a week to yank a bad or compromised release before
    # Dependabot proposes it (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
      # The OpenNMS images are the dependency this plugin exists to integrate
      # with, and they land in a test harness rather than a shipped artifact.
      # The full e2e/smoke suite gates the bump, so a waiting period buys
      # nothing that CI does not already buy. `exclude` beats `include`.
      exclude:
        - opennms/*
    commit-message:
      prefix: build
    labels:
      - dependencies
      - docker
    groups:
      # core, minion and sentinel must run the same version; split PRs stand
      # up a mismatched topology that fails the sentinel smoke.
      opennms:
        patterns:
          - opennms/*

  # The sandbox's snmpd image pins its base by digest (Scorecard's
  # pinned-dependencies check); this keeps the digest current.
  - package-ecosystem: docker
    directory: /e2e/snmpd
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - docker
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Give upstreams a week to yank a bad or compromised release before
    # Dependabot proposes it (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    labels:
      - dependencies
      - maven
