name: Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with SMOKE_DEFAULT_BACKENDS in the Makefile. This list
        # is hardcoded rather than derived, so a backend added there is NOT
        # picked up here — `headers` was added to the Makefile default and
        # silently never ran in CI until a review caught it.
        #
        # `headers` is the only gate that proves operator-configured HTTP
        # headers reach the wire: it fronts the backend with a proxy that
        # rejects any request lacking them, so samples land iff delivery
        # worked. Unit tests provably cannot cover that — the feature shipped
        # broken twice with the whole suite green — so this entry is the
        # regression barrier, not a nice-to-have.
        backend: [prometheus, mimir, victoriametrics, headers]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build KAR and run e2e smoke
        run: make smoke BACKENDS=${{ matrix.backend }} MAVEN_FLAGS="-B --no-transfer-progress -U"
