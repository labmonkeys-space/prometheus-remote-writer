name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true

permissions:
  contents: read

# Serialize releases, and NEVER cancel one in flight: a half-cancelled
# release can leave a GitHub Release with partial assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Maintainer whose GitHub-registered GPG key(s) sign release tags.
  # Trust anchor: https://github.com/<RELEASE_MAINTAINER>.gpg — the URL
  # returns all keys ever added to the profile, so historical keys also
  # verify (key rotation does not invalidate prior releases unless the
  # key is removed from the GitHub profile).
  RELEASE_MAINTAINER: indigo423

jobs:
  gates:
    # Same gates PRs enforce — a tag on a red commit must not release.
    uses: ./.github/workflows/quality-gates.yml

  release:
    name: Build KAR and create GitHub Release
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      # OIDC token for Sigstore — required by actions/attest-build-provenance
      # to mint an ephemeral signing certificate against this workflow run's
      # identity.
      id-token: write
      # GitHub Artifact Attestations API — required to upload the provenance
      # attestation bundle to the repo's /attestations endpoint.
      attestations: write
      # Needed by the final "Trigger docs publish" step, which dispatches
      # publish-docs.yml via `gh workflow run` after the release is created.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # No Maven cache on the release path (unlike CI): a poisoned cache
      # entry would flow straight into published, attested artifacts.
      # Releases are rare; the cold dependency fetch is an acceptable cost.

      - name: Resolve tag and version
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          # The tag reaches a filesystem path in "Resolve release notes"
          # below, so pin its shape here rather than trusting the
          # workflow_dispatch input. Rejects traversal and anything that is
          # not a SemVer release tag.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '${TAG}' is not a vMAJOR.MINOR.PATCH[-prerelease] tag." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag signature
        # Refuse to release from a tag not signed by a key on the
        # maintainer's GitHub profile. The .gpg URL returns all keys
        # ever added to that profile, so historical keys also verify
        # — key rotation does not invalidate prior releases unless the
        # key is removed from the GitHub profile.
        #
        # No GPG key material in CI secrets: the public-key fetch is
        # the entire trust path on the workflow side. The maintainer's
        # private key only ever sits on their workstation (used at
        # `git tag -s` time, per RELEASING.md pre-flight).
        #
        # `git tag -v` returns 0 for ANY good signature by ANY imported
        # key, including keys with no GPG web-of-trust. That is fine
        # here — the trust assertion is "the key is on the maintainer's
        # GitHub profile", not GPG's trust model. The asserted-key-count
        # check below is what enforces "the .gpg fetch actually
        # returned keys."
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Import all public keys registered on the maintainer's GitHub
          # profile. github.com/<user>.gpg is the canonical trust path.
          # --fail makes curl exit non-zero on 4xx/5xx; --retry guards
          # against transient GitHub blips. Without --fail an HTTP 404
          # (e.g., maintainer renamed) would silently feed an empty
          # body into gpg --import.
          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 5 \
               "https://github.com/${RELEASE_MAINTAINER}.gpg" \
            | gpg --import
          # Belt-and-braces: confirm at least one public key actually
          # landed in the keyring. Catches the corner case where the
          # GitHub profile has zero keys (empty body, no keys imported,
          # gpg exits 0).
          KEY_COUNT=$(gpg --list-keys --with-colons | grep -c '^pub:')
          if [ "$KEY_COUNT" -eq 0 ]; then
            echo "::error::No public keys imported from https://github.com/${RELEASE_MAINTAINER}.gpg. Add a GPG key under your GitHub Settings → SSH and GPG keys before tagging." >&2
            exit 1
          fi
          # The Checkout step's `ref` may not have populated tag refs.
          # Fetch the tag explicitly so `git tag -v` can find it.
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --no-tags
          if ! git tag -v "${TAG}"; then
            echo "::error::Tag ${TAG} is not signed by a key on github.com/${RELEASE_MAINTAINER}.gpg (or the signature does not verify). Sign with 'git tag -s' using a key registered on github.com/${RELEASE_MAINTAINER}'s profile and re-tag." >&2
            exit 1
          fi

      - name: Build KAR
        # Skip tests on the release path — the gates job above already ran
        # `make verify` on this ref before anything gets published.
        run: make kar MAVEN_FLAGS="-B --no-transfer-progress -U"

      - name: Generate SBOM
        # Activate the opt-in `sbom` profile to produce a CycloneDX 1.6
        # aggregate SBOM at target/bom.json. The profile is gated so that
        # local `make build` and `make kar` stay fast; only the release
        # path generates the SBOM.
        run: make sbom MAVEN_FLAGS="-B --no-transfer-progress -U"

      - name: Resolve release notes
        id: notes
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Precedence: a curated note for this tag wins over the CHANGELOG
          # extraction. The CHANGELOG carries the full design rationale, which
          # is the right depth for the repo and far too much for a release
          # page. Where no curated file exists the CHANGELOG section is still
          # used, so this stays backwards compatible.
          CURATED="docs/release-notes/${TAG}.md"
          if [ -s "$CURATED" ]; then
            cp "$CURATED" release-notes.md
            echo "Using curated release notes from ${CURATED}" >&2
            echo "notes-file=release-notes.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No curated notes at ${CURATED}; falling back to CHANGELOG.md" >&2
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found; using auto-generated notes" >&2
            exit 0
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { p=1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry for $VERSION; using auto-generated notes" >&2
          else
            echo "notes-file=release-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate KAR artifact
        id: kar
        run: |
          KAR=$(find assembly/kar/target -maxdepth 1 -name '*.kar' -type f | head -1)
          if [ -z "$KAR" ]; then
            echo "::error::No KAR found in assembly/kar/target" >&2
            exit 1
          fi
          echo "path=$KAR" >> "$GITHUB_OUTPUT"
          # Stable-name alias so the README's
          # releases/latest/download/prometheus-remote-writer.kar URL
          # keeps working across releases. Same bytes, same SHA-256, so
          # `gh attestation verify` accepts either filename.
          cp "$KAR" prometheus-remote-writer.kar

      - name: Stage SBOM at release name
        # Copy target/bom.json to the versioned filename consumers will
        # see on the release page. Kept as a separate step (rather than
        # inlined into Create GitHub Release) so the attestation step
        # can take subject-path against the final on-disk path.
        id: sbom
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SBOM="prometheus-remote-writer-${VERSION}.cdx.json"
          if [ ! -f target/bom.json ]; then
            echo "::error::target/bom.json missing; the Generate SBOM step did not produce the expected file." >&2
            exit 1
          fi
          # Validate the SBOM is well-formed JSON before we attest it.
          # An empty or malformed bom.json would still get a valid
          # provenance attestation over its SHA-256 — consumers would
          # then see a "verified" file they cannot parse.
          if ! jq empty target/bom.json >/dev/null 2>&1; then
            echo "::error::target/bom.json is not valid JSON; refusing to attest a corrupt SBOM." >&2
            exit 1
          fi
          cp target/bom.json "$SBOM"
          echo "path=$SBOM" >> "$GITHUB_OUTPUT"

      - name: Render SBOM HTML report
        # A self-contained HTML view of the same CycloneDX SBOM, attached
        # alongside the raw JSON so components and licences can be read
        # without installing tooling. No network at view time.
        #
        # The action is a composite that runs
        # ghcr.io/no42-org/blitsbom:report-<version> under Docker. Pinning
        # it by SHA still selects a version-matched generator: for a SHA ref
        # the action reads the version from its own package.json at that
        # commit, rather than falling back to the mutable main-tip
        # :report-rc image.
        id: sbom-html
        uses: no42-org/blitsbom@0ddd4fd19cc563e3e1c1e27f7be2ffc7225dca65  # v0.8.2
        with:
          sbom: ${{ steps.sbom.outputs.path }}
          output: prometheus-remote-writer-${{ steps.resolve.outputs.version }}-sbom.html
          # Both passed explicitly rather than left to the action's defaults,
          # which derive from the ref. On the workflow_dispatch re-run path
          # github.ref_name is a branch rather than the tag, and the report
          # would silently fall back to the version recorded inside the SBOM.
          project: prometheus-remote-writer
          version: ${{ steps.resolve.outputs.version }}

      - name: Attest KAR build provenance
        # SLSA Build Provenance attestation for the KAR. Signed by
        # Sigstore using a Fulcio-issued ephemeral certificate bound to
        # this workflow run's GitHub OIDC token. Attestation is stored
        # on the repo's /attestations endpoint and surfaced to verifiers
        # via `gh attestation verify`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.kar.outputs.path }}

      - name: Attest SBOM build provenance
        # Same treatment for the SBOM. One attestation per release
        # artifact — verifiers run `gh attestation verify` against each
        # downloaded file independently.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.sbom.outputs.path }}

      - name: Attest SBOM report build provenance
        # The HTML report is a published release asset like any other, so
        # it carries provenance too. Without it the one asset a human is
        # most likely to open in a browser would be the only one whose
        # origin cannot be checked.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.sbom-html.outputs.report }}

      - name: Create GitHub Release
        # Four assets: the versioned KAR, its stable-name alias, the SBOM
        # and its HTML report. Authenticity is verified via the build provenance
        # attestations, fetched server-side by `gh attestation verify`.
        # No .asc / KEYS / checksum files — the attestation encodes the
        # artifact's SHA-256 and binds it to this workflow's OIDC identity.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          KAR: ${{ steps.kar.outputs.path }}
          SBOM: ${{ steps.sbom.outputs.path }}
          SBOM_HTML: ${{ steps.sbom-html.outputs.report }}
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
        run: |
          # The v*.*.* trigger glob also matches prerelease tags like
          # v1.0.0-rc1; mark those as prereleases so `latest` (and the
          # stable-alias download URL) keeps pointing at the newest
          # stable release.
          case "$TAG" in
            *-*) FLAGS=(--prerelease) ;;
            *)   FLAGS=() ;;
          esac
          ASSETS=(
            "$KAR"
            prometheus-remote-writer.kar
            "$SBOM"
            "$SBOM_HTML"
          )
          if [ -n "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              "${FLAGS[@]}" \
              "${ASSETS[@]}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${FLAGS[@]}" \
              "${ASSETS[@]}"
          fi

      # The `release: published` event fired by `gh release create` runs
      # under GITHUB_TOKEN, so by design GitHub Actions does NOT cascade
      # it to other workflows. Manually dispatch publish-docs against
      # the just-released tag — `workflow_dispatch` is allowed even
      # when initiated by GITHUB_TOKEN.
      - name: Trigger docs publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          gh workflow run publish-docs.yml --ref main -f tag="$TAG"
