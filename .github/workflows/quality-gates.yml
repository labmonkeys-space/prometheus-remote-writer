name: Quality gates

# Reusable quality gates, defined once and referenced by both the CI and
# Release workflows. Adding a gate or bumping a pin is a one-file change —
# no chance of a release publishing through a gate that PRs enforce.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build, run unit tests, and assemble the KAR
        run: make verify MAVEN_FLAGS="-B --no-transfer-progress -U"

      - name: Upload KAR artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: prometheus-remote-writer-kar
          path: assembly/kar/target/*.kar
          if-no-files-found: warn
          retention-days: 14

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

  badge-drift:
    # Declaration-drift checks. They exist because the files involved are
    # edited independently — a Dependabot bump touches one and nothing
    # notices the others fell out of step. That is how the KAR ended up
    # unable to install on Horizon 36.0.4 (#139).
    name: Check version declarations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify README badge matches the e2e Horizon pin
        run: make verify-badge

      - name: Verify the backend versions the docs quote match the compose pins and the IT references
        run: make verify-versions

      - name: Verify the integration-api floor agrees across pom, feature and bundle
        run: make verify-compat

      - name: Verify docs listing blocks resolve their attributes
        run: make verify-docs-attrs

  workflow-lint:
    # Lints the workflows themselves: unpinned actions, script injection,
    # bad expressions, invalid schema. Cheap, and enforces the pinning and
    # injection-safety rules mechanically instead of by review memory.
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        # docker:// refs pin by image digest, not commit SHA.
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # v1.7.12
        with:
          args: -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          # Code scanning upload needs GHAS/code-scanning enabled; emit
          # inline annotations instead and fail the job on findings.
          advanced-security: false
          annotations: true
          # Low findings are stylistic (e.g. ./ vs $/ reusable-workflow
          # refs); fail the gate on medium and above.
          min-severity: medium
