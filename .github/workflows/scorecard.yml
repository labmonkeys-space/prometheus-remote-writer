name: Scorecard

# OpenSSF Scorecard: an external auditor grading supply-chain hygiene
# (pinning, branch protection, tokens, dangerous workflows, …).
# Results land in the Security tab and on the public Scorecard API.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 2'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read          # checkout
      security-events: write  # upload SARIF
      id-token: write         # publish_results
      actions: read           # Branch-Protection / Webhooks checks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
