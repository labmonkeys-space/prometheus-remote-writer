name: Scorecard

# OpenSSF Scorecard: an external auditor grading supply-chain hygiene
# (pinning, branch protection, tokens, dangerous workflows, …).
# Results land in the Security tab and on the public Scorecard API.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 2'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read          # checkout
      security-events: write  # upload SARIF
      id-token: write         # publish_results
      actions: read           # Branch-Protection / Webhooks checks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: results.sarif
