apiVersion: 1

# Dashboard provisioning shared by every backend variant: compose.base.yml
# mounts this file into Grafana's provisioning dir and the JSON files next
# to it into /var/lib/grafana/dashboards. The dashboards pick the default
# datasource (each compose.<backend>.yml provisions exactly one, marked
# isDefault), so the same JSON serves Prometheus, Mimir and VictoriaMetrics.
providers:
  - name: opennms-e2e
    folder: OpenNMS
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
