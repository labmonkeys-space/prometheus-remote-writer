# prometheus-remote-writer plugin config — custom HTTP headers gate.
#
# Mounted into /opt/opennms-etc-overlay/ → landed at
# /opt/opennms/etc/org.opennms.plugins.tss.prometheusremotewriter.cfg at
# container start.
#
# Both URLs point at the nginx auth gate, not at Prometheus. The gate 403s
# anything without X-Smoke-Token, so samples reaching the backend proves
# the http.headers.* entry below was parsed, validated, and attached to
# outbound requests on both the write and the read client.

write.url = http://authgate:8080/api/v1/write
read.url  = http://authgate:8080

# The header under test, supplied through Karaf's ${env:NAME} interpolation
# rather than as a literal. This is deliberate and load-bearing: the gate
# rejects any request whose token is wrong, so the run passes only if Karaf
# resolved the reference from the container environment. That makes the
# documented interpolation behaviour a CI gate rather than a claim in prose.
# See the "Keeping secrets out of the configuration file" docs section.
http.headers.X-Smoke-Token = ${env:SMOKE_TOKEN}

# A second entry, differently cased, so the run also covers operator-casing
# preservation and the multi-header path rather than just one happy header.
http.headers.x-smoke-instance = e2e-headers

# The custom Authorization scheme (issue #56). The gate requires the exact
# string "Token s3cr3t-smoke", so this run fails if the plugin defaults the
# scheme, lowercases it, joins the two halves with the wrong spacing, or sends
# the credential as Bearer. Both the write and the read client go through the
# gate, so it also proves the symmetric-emission claim.
#
# The credential comes through ${env:NAME} on purpose: it makes the documented
# interpolation behaviour a CI gate for a credentials key specifically, which
# is the acceptance criterion the spec could previously only claim by
# construction. The scheme keyword stays a literal — it is required, has no
# default, and an empty ${env:} would simply fail startup by name.
auth.authorization.type        = Token
auth.authorization.credentials = ${env:SMOKE_TOKEN}

# Faster flush than the production default — feedback loop of seconds, not
# minutes, when iterating in the sandbox.
batch.size                = 200
flush.interval-ms         = 500
queue.capacity            = 5000

# Tighter retries so a down backend is reported quickly.
retry.max-attempts        = 3
retry.initial-backoff-ms  = 250
retry.max-backoff-ms      = 2000

shutdown.grace-period-ms  = 5000

# Same label discipline as the other backends, so this variant is subject to
# the SMOKE_LABEL_BOUND assertion on equal terms (#112).
labels.include = sys*, os, hostname, netbios*
labels.exclude = asset_*, area, domain
