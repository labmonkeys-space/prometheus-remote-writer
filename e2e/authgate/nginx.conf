# Zero-Trust gateway stand-in for the http.headers.* smoke gate.
#
# Sits in front of Prometheus and refuses anything that does not carry the
# operator-configured custom header. This turns the harness's existing
# "samples landed" assertion into a proof that http.headers.* reached the
# wire: if the header is missing, every remote-write POST is rejected with
# 403 and no series ever appear.
#
# Modelled on Cloudflare Access service tokens (CF-Access-Client-Id /
# -Secret), which is the motivating deployment shape for the feature.

events {}

http {
    # Docker's embedded DNS, so an upstream restart is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The Makefile asserts against this line, so the format is load-bearing:
    # it must show the method, path, status and the received token.
    log_format gate '$remote_addr "$request" -> $status '
                    'x-smoke-token=[$http_x_smoke_token] '
                    'x-smoke-instance=[$http_x_smoke_instance] '
                    'authorization=[$http_authorization]';
    access_log /dev/stdout gate;
    error_log  /dev/stderr warn;

    map $http_x_smoke_token $smoke_token_ok {
        default            0;
        "s3cr3t-smoke"     1;
    }

    # Second header, gated too. headers.cfg claims this covers the
    # multi-header path; without inspecting it here that claim would be
    # false, and a regression attaching only the first header would pass.
    map $http_x_smoke_instance $smoke_instance_ok {
        default            0;
        "e2e-headers"      1;
    }

    # Third gate: the custom Authorization scheme (auth.authorization.type +
    # auth.authorization.credentials, issue #56). Requires the exact scheme
    # keyword AND the exact credential, so this fails if the plugin defaults
    # the scheme, lowercases it, joins with the wrong spacing, or sends the
    # credential under Bearer. Without inspecting it here the whole feature
    # could be deleted and this gate would still pass.
    # A case-sensitive REGEX (~), not a plain string: nginx's map matches
    # string keys case-INSENSITIVELY, so "token s3cr3t-smoke" would pass a
    # plain-string map and the casing-preservation claim below would be
    # untested. Verified by probing this file directly with a lowercased
    # scheme — it returned 200 before this was a regex.
    map $http_authorization $smoke_authorization_ok {
        default                       0;
        "~^Token s3cr3t-smoke$"       1;
    }

    map "$smoke_token_ok$smoke_instance_ok$smoke_authorization_ok" $smoke_ok {
        default            0;
        "111"              1;
    }

    server {
        listen 8080;

        # Remote-write batches routinely exceed nginx's 1m default, which
        # would surface as a 413 and be misread as "the plugin sent no
        # headers".
        client_max_body_size 32m;

        # Both the write path and the read path go through the gate: the
        # feature's symmetric-application claim is that one config drives
        # both clients, and a write-only implementation would 403 on
        # dashboard queries. Gating both is what makes that testable.
        location / {
            if ($smoke_ok = 0) {
                return 403 "missing or wrong X-Smoke-Token / X-Smoke-Instance / Authorization\n";
            }
            set $upstream http://prometheus:9090;
            proxy_pass $upstream$request_uri;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
        }

        # Unauthenticated liveness probe so compose can gate startup
        # without punching a hole in the credential check above.
        location = /gate-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
