# Zero-Trust gateway stand-in for the http.headers.* smoke gate.
#
# Sits in front of Prometheus and refuses anything that does not carry the
# operator-configured custom header. This turns the harness's existing
# "samples landed" assertion into a proof that http.headers.* reached the
# wire: if the header is missing, every remote-write POST is rejected with
# 403 and no series ever appear.
#
# Modelled on Cloudflare Access service tokens (CF-Access-Client-Id /
# -Secret), which is the motivating deployment shape for the feature.

events {}

http {
    # Docker's embedded DNS, so an upstream restart is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format gate '$remote_addr "$request" -> $status '
                    'x-smoke-token=[$http_x_smoke_token]';
    access_log /dev/stdout gate;
    error_log  /dev/stderr warn;

    map $http_x_smoke_token $smoke_token_ok {
        default            0;
        "s3cr3t-smoke"     1;
    }

    server {
        listen 8080;

        # Both the write path and the read path go through the gate: the
        # feature's symmetric-application claim is that one config drives
        # both clients, and a write-only implementation would 403 on
        # dashboard queries. Gating both is what makes that testable.
        location / {
            if ($smoke_token_ok = 0) {
                return 403 "missing or wrong X-Smoke-Token\n";
            }
            set $upstream http://prometheus:9090;
            proxy_pass $upstream$request_uri;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
        }

        # Unauthenticated liveness probe so compose can gate startup
        # without punching a hole in the credential check above.
        location = /gate-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
